name: Daily Claude News

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点自动运行
  workflow_dispatch: # 允许我们手动点击运行

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: 准备 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: pip install anthropic
      
    - name: 运行 Claude 脚本
       run: python generate_news.py
       env:
         # 这里的 ANTHROPIC_API_KEY 需要和你 Python 代码里读取的变量名一致
         # ${{ secrets.ANTHROPIC_API_KEY }} 这里的名字必须和你第一步在 GitHub Secrets 里起的名字一模一样
         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
    - name: 保存数据到仓库
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git commit -m "自动更新每日简报" || echo "今天没有新变化"
        git push
